<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hangman Game</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <h1>🎯 Hangman Game</h1>

        <div class="menu">

            <div class="section">

                <label>
                    Difficulty
                </label>

                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                    <option value="extreme">Extreme</option>
                    <option value="impossible">Impossible</option>
                </select>

            </div>

            <div class="section">

                <label>
                    Topic
                </label>

                <select id="topic">
                </select>

            </div>

            <button id="startBtn">
                Start Game
            </button>

        </div>

        <div id="game">

            <div id="info">

                <h2 id="topicName">
                    Topic
                </h2>

                <h3 id="difficultyName">
                    Difficulty
                </h3>

            </div>

            <div id="word">
                _ _ _ _
            </div>

            <div id="lives">
                Lives: 0
            </div>

            <div id="hint">
            </div>

            <div id="guessed">
                Guessed:
            </div>

            <div class="guessArea">

                <input
                    id="guessInput"
                    type="text"
                    maxlength="1"
                    autocomplete="off">

                <button id="guessBtn">
                    Guess
                </button>

            </div>

            <div id="message">
            </div>

        </div>

        <div id="stats">

            <h2>Statistics</h2>

            <p id="wins">
                Wins: 0
            </p>

            <p id="losses">
                Losses: 0
            </p>

            <p id="score">
                Score: 0
            </p>

            <p id="highScore">
                High Score: 0
            </p>

        </div>

    </div>

    <script src="easy.js"></script>
    <script src="medium.js"></script>
    <script src="hard.js"></script>
    <script src="extreme.js"></script>
    <script src="impossible.js"></script>

    <script src="script.js"></script>

</body>

</html>
